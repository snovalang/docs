{% assign current_lang = page.lang | default: "en" %}
{% assign t = site.data.i18n[current_lang] %}
<header class="site-header">
  <div class="site-header-left">
    <button type="button" class="icon-btn mobile-nav-toggle" id="mobile-nav-toggle" aria-label="{{ t.menu_label }}" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a class="brand-link" href="{{ '/' | append: current_lang | append: '/' | relative_url }}">
      <span class="brand-mark">SN</span>
      <span class="brand-text">
        <strong>{{ t.site_title }}</strong>
        <small>{{ t.site_tagline }}</small>
      </span>
    </a>
  </div>

  <div class="site-header-right">
    <button type="button" class="search-trigger" id="search-trigger">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>{{ t.search_shortcut }}</span>
      <kbd>/</kbd>
    </button>

    {% include lang-switcher.html %}

    <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="{{ t.theme_label }}" title="{{ t.theme_label }}">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>
</header>
