layout: null
permalink: /
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snovalang Technical Documentation</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <style>
    .landing-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .landing-card {
      width: 100%;
      max-width: 560px;
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-elevated);
    }
    .landing-card h1 { margin: 14px 0 8px; font-size: 26px; }
    .landing-card p { margin: 0 0 22px; color: var(--text-muted); }
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .lang-card {
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      text-decoration: none;
    }
    .lang-card:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
    .lang-card strong { font-size: 15px; }
    .lang-card span { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    @media (max-width: 540px) { .lang-grid { grid-template-columns: 1fr; } }
  </style>
  <script>
    (function () {
      var saved = localStorage.getItem("snova-docs-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <main class="landing-wrap">
    <section class="landing-card">
      <span class="brand-mark">SN</span>
      <h1>Snovalang Documentation</h1>
      <p>Select your preferred language for the technical reference of Snovalang and the <code>snovac</code> compiler.</p>
      <div class="lang-grid">
        <a class="lang-card" href="{{ '/en/' | relative_url }}" hreflang="en">
          <strong>English</strong>
          <span>/en/</span>
        </a>
        <a class="lang-card" href="{{ '/pt-br/' | relative_url }}" hreflang="pt-BR">
          <strong>Português (BR)</strong>
          <span>/pt-br/</span>
        </a>
        <a class="lang-card" href="{{ '/es/' | relative_url }}" hreflang="es">
          <strong>Español</strong>
          <span>/es/</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
